<style>
  /* ---------- tokens ---------- */
  :root{
    --bg:#EFF2EC; --surface:#FFFFFF; --surface-alt:#E7ECE4; --surface-raised:#FFFFFF;
    --text:#16201C; --text-muted:#5B6A62; --border:#D7DED4;
    --accent:#C97A1E; --accent-ink:#5A3A0E; --accent-2:#2F8C4C; --danger:#C23A3A;
    --shadow: 0 1px 2px rgba(20,30,20,.06);
    --radius: 3px;
    --turf-a:#2E8C3A; --turf-b:#1F6B29;
    --surface-glass: rgba(255,255,255,.72);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12181C; --surface:#1B2229; --surface-alt:#212B31; --surface-raised:#232E35;
      --text:#EDEAE2; --text-muted:#8FA0AC; --border:#2A343B;
      --accent:#F2A93B; --accent-ink:#2A1D08; --accent-2:#4FA968; --danger:#E15252;
      --shadow: 0 2px 10px rgba(0,0,0,.35);
      --turf-a:#12351C; --turf-b:#0C2513;
      --surface-glass: rgba(27,34,41,.66);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181C; --surface:#1B2229; --surface-alt:#212B31; --surface-raised:#232E35;
    --text:#EDEAE2; --text-muted:#8FA0AC; --border:#2A343B;
    --accent:#F2A93B; --accent-ink:#2A1D08; --accent-2:#4FA968; --danger:#E15252;
    --shadow: 0 2px 10px rgba(0,0,0,.35);
    --turf-a:#12351C; --turf-b:#0C2513;
    --surface-glass: rgba(27,34,41,.66);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 50% 320px, transparent 118px, rgba(255,255,255,.16) 120px, rgba(255,255,255,.16) 122px, transparent 124px),
      linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.16) calc(50% - 1px), rgba(255,255,255,.16) calc(50% + 1px), transparent calc(50% + 1px)),
      repeating-linear-gradient(115deg, var(--turf-a) 0px, var(--turf-a) 64px, var(--turf-b) 64px, var(--turf-b) 128px);
    background-attachment:fixed, fixed, fixed;
    color:var(--text);
    font-family:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.num,.brand-word,.stat-num{font-family:'Bebas Neue','Oswald',Impact,sans-serif; letter-spacing:.02em; font-weight:400;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}

  .app-shell{display:flex; min-height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:236px; flex:0 0 236px; background:var(--surface-glass); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px; border-bottom:1px solid var(--border); margin-bottom:14px;}
  .brand-mark{width:34px;height:34px; flex:0 0 34px;}
  .brand-mark svg{width:100%;height:100%;}
  .brand-word{font-size:22px; line-height:1; white-space:nowrap;}
  .brand-word small{display:block; font-family:'IBM Plex Sans',sans-serif; font-size:10.5px; letter-spacing:.06em; color:var(--text-muted); margin-top:2px;}

  .nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .nav-item{display:flex; align-items:center; gap:12px; padding:10px 10px; border-radius:var(--radius); cursor:pointer; color:var(--text-muted); border:1px solid transparent; font-size:14.5px;}
  .nav-item svg{width:19px;height:19px; flex:0 0 19px;}
  .nav-item:hover{background:var(--surface-alt); color:var(--text);}
  .nav-item.active{background:var(--surface-alt); color:var(--text); border-color:var(--border); font-weight:600;}
  .nav-item.active svg{color:var(--accent);}

  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--border);}
  .log-btn{
    width:100%; background:var(--accent); color:var(--accent-ink); border:none; padding:11px 12px;
    border-radius:var(--radius); font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .log-btn:hover{filter:brightness(1.06);}
  .log-btn svg{width:16px;height:16px;}

  /* ---------- main column ---------- */
  .main-col{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:none; align-items:center; justify-content:space-between; padding:14px 16px;
    background:var(--surface-glass); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  .topbar h1{font-size:22px; margin:0;}
  main{
    flex:1; padding:26px 34px 40px; max-width:980px; width:100%; margin:20px auto 80px;
    background:var(--surface-glass); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow);
  }

  .view-head{margin-bottom:22px;}
  .view-head h1{font-size:34px; margin:0 0 4px;}
  .view-head p{margin:0; color:var(--text-muted); font-size:14px; max-width:60ch;}

  /* ---------- reusable bits ---------- */
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:3px 9px 3px 7px; border-radius:20px; background:var(--surface-alt); border:1px solid var(--border); color:var(--text-muted); white-space:nowrap;}
  .pill .dot{width:6px;height:6px;border-radius:50%;}
  .dot-league{background:var(--accent-2);} .dot-euro{background:var(--accent);} .dot-derby{background:var(--danger);}

  .badge{
    width:34px;height:34px;border-radius:50%; flex:0 0 34px; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif; font-size:13px; color:#fff; letter-spacing:.02em;
  }

  .stars{display:inline-flex; gap:2px;}
  .stars svg{width:15px;height:15px;}
  .star-fill{fill:var(--accent); stroke:var(--accent);}
  .star-empty{fill:none; stroke:var(--border); stroke-width:1.4;}
  .star-pick{cursor:pointer; width:26px !important; height:26px !important;}

  .divider-row{padding:16px 4px; border-bottom:1px dashed var(--border); display:flex; gap:16px; align-items:flex-start;}
  .divider-row:last-child{border-bottom:none;}
  .date-col{width:54px; flex:0 0 54px; text-align:center; padding-top:2px;}
  .date-col .d{font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1;}
  .date-col .m{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}

  .row-main{flex:1; min-width:0;}
  .row-title{font-size:16px; font-weight:600; margin:0 0 4px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .row-score{color:var(--text-muted); font-weight:400;}
  .row-meta{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
  .row-review{font-size:13.5px; color:var(--text-muted); margin:0; line-height:1.5; max-width:64ch;}
  .row-side{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:8px;}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{background:none;border:1px solid var(--border);border-radius:var(--radius); width:26px;height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted);}
  .icon-btn:hover{color:var(--text); border-color:var(--text-muted);}
  .icon-btn svg{width:13px;height:13px;}

  .live-tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--accent-2); font-weight:600;}
  .live-tag svg{width:11px;height:11px;}

  .empty{padding:50px 10px; text-align:center; color:var(--text-muted); border:1px dashed var(--border); border-radius:var(--radius);}
  .empty h3{color:var(--text); margin:0 0 6px; font-family:'IBM Plex Sans'; font-size:16px; font-weight:600;}
  .empty p{margin:0 0 16px; font-size:13.5px;}
  .btn{background:var(--surface-alt); border:1px solid var(--border); color:var(--text); padding:9px 16px; border-radius:var(--radius); cursor:pointer; font-size:13.5px; font-weight:600;}
  .btn:hover{border-color:var(--text-muted);}
  .btn-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  /* ---------- home hero ---------- */
  .hero{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:26px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .hero h2{margin:0 0 4px; font-size:26px;}
  .hero p{margin:0; color:var(--text-muted); font-size:13.5px; max-width:44ch;}
  .radar-strip{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .radar-chip{background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px; font-size:12.5px; display:flex; align-items:center; gap:8px;}
  .radar-chip .hype{font-family:'Bebas Neue'; color:var(--accent); font-size:16px;}

  /* ---------- stats grid ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:26px;}
  .stat-cell{background:var(--surface); padding:18px 16px;}
  .stat-num{font-size:40px; line-height:1; color:var(--accent);}
  .stat-label{font-size:12px; color:var(--text-muted); margin-top:4px;}

  /* ---------- feed ---------- */
  .feed-item{display:flex; gap:12px; padding:16px 4px; border-bottom:1px dashed var(--border);}
  .feed-item:last-child{border-bottom:none;}
  .avatar{width:38px;height:38px;border-radius:50%; background:var(--surface-alt); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex:0 0 38px;}
  .feed-name{font-weight:600; font-size:14px;}
  .feed-when{color:var(--text-muted); font-size:12px; font-weight:400;}

  /* ---------- lookout ---------- */
  .lookout-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
  .lookout-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:10px;}
  .hype-score{font-family:'Bebas Neue'; font-size:34px; color:var(--accent); line-height:1;}
  .hype-score span{display:block; font-family:'IBM Plex Sans'; font-size:10px; color:var(--text-muted); font-weight:600;}
  .meter{height:6px; background:var(--surface-alt); border-radius:6px; overflow:hidden; margin:10px 0;}
  .meter-fill{height:100%; background:linear-gradient(90deg, var(--accent-2), var(--accent));}
  .reason-tags{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---------- lists ---------- */
  .list-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; cursor:pointer;}
  .list-card:hover{border-color:var(--text-muted);}
  .list-card h3{margin:0 0 4px; font-family:'IBM Plex Sans'; font-size:16px; font-weight:600;}
  .list-card p{margin:0; font-size:13px; color:var(--text-muted);}
  .list-count{font-size:12px; color:var(--accent); font-weight:600;}

  /* ---------- wrapped ---------- */
  .wrapped-card{background:linear-gradient(160deg, var(--surface-raised), var(--surface)); border:1px solid var(--border); border-radius:var(--radius); padding:30px; max-width:520px;}
  .wrapped-year{font-size:52px; line-height:1; color:var(--accent);}
  .wrapped-sub{color:var(--text-muted); font-size:13px; margin-bottom:18px;}
  .wrapped-row{display:flex; justify-content:space-between; align-items:baseline; padding:12px 0; border-bottom:1px dashed var(--border);}
  .wrapped-row:last-child{border-bottom:none;}
  .wrapped-row .label{font-size:13px; color:var(--text-muted);}
  .wrapped-row .val{font-family:'Bebas Neue'; font-size:24px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{background:var(--surface-alt); border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-size:12.5px;}

  /* ---------- profile ---------- */
  .profile-head{display:flex; gap:18px; align-items:center; margin-bottom:22px; flex-wrap:wrap;}
  .avatar-lg{width:70px;height:70px;border-radius:50%; background:conic-gradient(var(--accent), var(--accent-2)); display:flex; align-items:center; justify-content:center; flex:0 0 70px;}
  .avatar-lg span{width:62px;height:62px;border-radius:50%;background:var(--surface); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue'; font-size:24px;}
  input.inline, textarea.inline{background:transparent; border:none; border-bottom:1px dashed var(--border); color:var(--text); font-family:inherit; padding:2px 0; width:100%;}
  input.inline:focus, textarea.inline:focus{outline:none; border-bottom-color:var(--accent);}
  .profile-head h2{margin:0 0 2px; font-size:26px;}
  .team-chip{display:inline-flex; align-items:center; gap:6px; background:var(--surface-alt); border:1px solid var(--border); border-radius:20px; padding:5px 6px 5px 12px; font-size:12.5px;}
  .team-chip button{background:none;border:none;color:var(--text-muted); cursor:pointer; font-size:14px; line-height:1; padding:2px;}
  .add-team-form{display:flex; gap:6px; margin-top:10px;}
  .add-team-form input{flex:1; padding:7px 10px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13px;}

  /* ---------- modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(10,14,12,.55); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto; animation:fadein .15s ease;}
  @keyframes fadein{from{opacity:0} to{opacity:1}}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); width:100%; max-width:480px; padding:24px; animation:pop .16s ease;}
  @keyframes pop{from{transform:translateY(6px) scale(.98); opacity:0} to{transform:none; opacity:1}}
  .modal h2{margin:0 0 16px; font-size:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{width:100%; padding:9px 10px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:14px;}
  .field textarea{resize:vertical; min-height:70px;}
  .row-2{display:flex; gap:10px;}
  .row-2 .field{flex:1;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .checkline{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:14px;}
  .picker-item{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--border); font-size:13.5px;}

  /* ---------- bottom nav (mobile) ---------- */
  .bottom-nav{display:none;}

  @media (max-width: 880px){
    .sidebar{display:none;}
    .topbar{display:flex;}
    main{margin:12px 10px 90px; padding:18px 16px 30px;}
    .view-head h1{font-size:26px;}
    .bottom-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface-glass);
      backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); border-top:1px solid var(--border);
      overflow-x:auto; z-index:30;
    }
    .bn-item{flex:1 0 auto; min-width:66px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 6px 8px; color:var(--text-muted); font-size:9.5px; cursor:pointer;}
    .bn-item svg{width:18px;height:18px;}
    .bn-item.active{color:var(--accent);}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <div class="topbar" id="topbar"></div>
    <main id="content"></main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  /* ================= ICONS ================= */
  const ic = {
    home:'<path d="M3 11.5 12 4l9 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round"/>',
    diary:'<rect x="4.5" y="3.5" width="15" height="17" rx="1.5"/><path d="M8 3.5v17M8 7.5h8M8 11.5h8M8 15.5h5" stroke-linecap="round"/>',
    calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke-linecap="round"/>',
    stadium:'<path d="M3 15c0-4.5 4-8 9-8s9 3.5 9 8" stroke-linecap="round"/><path d="M3 15v3.5h18V15" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 15V9.8M16.5 15V9.8" stroke-linecap="round"/>',
    radar:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3.5V2M12 22v-1.5M20.5 12H22M2 12h1.5" stroke-linecap="round"/><path d="M12 12l6-4" stroke-linecap="round"/>',
    list:'<path d="M9 6h11M9 12h11M9 18h11" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.4"/><circle cx="4.5" cy="12" r="1.4"/><circle cx="4.5" cy="18" r="1.4"/>',
    wrapped:'<path d="M12 3v6M12 21c4-3 4-6.5 4-8.5A4 4 0 0 0 12 8a4 4 0 0 0-4 4.5c0 2 0 5.5 4 8.5Z" stroke-linejoin="round"/><path d="M8.5 6 12 3l3.5 3" stroke-linecap="round" stroke-linejoin="round"/>',
    user:'<circle cx="12" cy="8.2" r="3.6"/><path d="M4.5 20c1-4 4-6 7.5-6s6.5 2 7.5 6" stroke-linecap="round"/>',
    plus:'<path d="M12 5v14M5 12h14" stroke-linecap="round"/>',
    pin:'<path d="M12 21s7-6.2 7-11.3A7 7 0 0 0 5 9.7C5 14.8 12 21 12 21Z" stroke-linejoin="round"/><circle cx="12" cy="9.6" r="2.3"/>',
    edit:'<path d="M4 20l.9-3.6L16.4 5 19 7.6 7.6 19 4 20Z" stroke-linejoin="round"/>',
    trash:'<path d="M5 7h14M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M7 7l1 13h8l1-13" stroke-linecap="round" stroke-linejoin="round"/>',
    starFull:'M12 3.2l2.7 5.9 6.3.6-4.8 4.2 1.4 6.2-5.6-3.5-5.6 3.5 1.4-6.2-4.8-4.2 6.3-.6z'
  };
  function svg(name, cls){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="${cls||''}">${ic[name]}</svg>`; }
  function starIcon(filled, big){ return `<svg viewBox="0 0 24 24" class="${filled?'star-fill':'star-empty'} ${big?'star-pick':''}" stroke-width="1.2"><path d="${ic.starFull}"/></svg>`; }

  const brandLogoSVG = `<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
    <polygon points="37,34 59,34 59,86 48,75 37,86" style="fill:var(--accent)"/>
    <circle cx="48" cy="38" r="29" style="fill:var(--surface); stroke:var(--text); stroke-width:2.5"/>
    <g style="stroke:var(--text); stroke-width:3; stroke-linecap:round">
      <line x1="48" y1="27" x2="48" y2="11"/>
      <line x1="58.46" y1="34.6" x2="73.68" y2="29.66"/>
      <line x1="54.47" y1="46.9" x2="63.88" y2="59.84"/>
      <line x1="41.53" y1="46.9" x2="32.12" y2="59.84"/>
      <line x1="37.54" y1="34.6" x2="22.32" y2="29.66"/>
    </g>
    <polygon points="48,27 58.46,34.6 54.47,46.9 41.53,46.9 37.54,34.6" style="fill:var(--text)"/>
  </svg>`;

  /* ================= DATA: teams & badge colours ================= */
  const teamColor = {};
  const palette = ['#C0392B','#2471A3','#B7950B','#6C3483','#1E8449','#A04000','#117864','#943126','#2E4053','#7D6608','#154360','#7B241C','#0E6251'];
  let ci = 0;
  function colorFor(team){
    if(!teamColor[team]){ teamColor[team] = palette[ci % palette.length]; ci++; }
    return teamColor[team];
  }
  function initials(team){
    const small = new Set(['de','of','and','fc','cf','ac','sc','le']);
    const words = team.replace(/&/g,' ').split(/\s+/).filter(w=>w && !small.has(w.toLowerCase()));
    if(words.length===1) return words[0].slice(0,2).toUpperCase();
    return (words[0][0]+words[1][0]).toUpperCase();
  }
  function badge(team){ return `<div class="badge" style="background:${colorFor(team)}">${initials(team)}</div>`; }

  /* ================= DATA: competitions ================= */
  const compType = {
    'Premier League':'league', 'La Liga':'league', 'Serie A':'league', 'Bundesliga':'league',
    'Scottish Premiership':'league', 'Champions League':'euro', 'World Cup':'euro'
  };
  function compPill(comp, derby){
    const cls = derby ? 'dot-derby' : (compType[comp]==='euro' ? 'dot-euro' : 'dot-league');
    return `<span class="pill"><span class="dot ${cls}"></span>${comp}</span>`;
  }

  /* ================= SEED / STATE ================= */
  const STORAGE_KEY = 'balloondiary_v2';

  const defaultProfile = {
    name:'', handle:'', bio:'',
    favouriteTeams:[]
  };

  const seedDiary = [];

  const seedLists = [];

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.warn('storage read failed', e); }
    return { profile: defaultProfile, diary: seedDiary, lists: seedLists };
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({profile: db.profile, diary: db.diary, lists: db.lists})); }
    catch(e){ console.warn('storage write failed', e); }
  }

  let db = load();
  let view = 'home';
  let editingId = null;

  /* ================= MOCK FRIENDS FEED (static, illustrative) ================= */
  const friends = [
    {id:'f1', name:'Jamie Ortiz', team:'Arsenal'},
    {id:'f2', name:'Priya Nair', team:'Liverpool'},
    {id:'f3', name:'Tom Becker', team:'Bayern Munich'},
    {id:'f4', name:'Sofia Marín', team:'Real Madrid'}
  ];
  const feed = [
    {friend:'f1', home:'Arsenal', away:'Napoli', competition:'Champions League', rating:4, when:'2 days ago', review:'Backs against the wall for long spells but that\'s three from three in the group. Loud away end tonight.'},
    {friend:'f4', home:'Elche', away:'Real Madrid', competition:'La Liga', rating:3, when:'2 days ago', review:'Scrappy, five goals, could have been ten. Points are points on the road though.'},
    {friend:'f2', home:'Liverpool', away:'Atletico Madrid', competition:'Champions League', rating:5, when:'1 week ago', review:'Anfield under the lights for a European night. That is what this competition should always feel like.'},
    {friend:'f3', home:'Bayern Munich', away:'Bodo/Glimt', competition:'Champions League', rating:2, when:'1 week ago', review:'Five nil and never in doubt. Nice evening out, forgettable match.'},
    {friend:'f1', home:'Sunderland', away:'Arsenal', competition:'Premier League', rating:4, when:'1 week ago', review:'Away day up north, professional performance, job done before half time.'}
  ];

  /* ================= REAL FIXTURE DATA (upcoming) ================= */
  // Estimated recent-meetings stats are illustrative averages used only to power the "hype" model below.
  const fixtures = [
    {home:'Brentford', away:'Chelsea', competition:'Premier League', date:'2026-09-18', time:'20:00', probHome:35.1, probAway:39.8, avgGoals:2.9, meetings:6, derby:false},
    {home:'Espanyol', away:'Elche', competition:'La Liga', date:'2026-09-18', time:'20:00', probHome:51.9, probAway:22.0, avgGoals:2.4, meetings:4, derby:false},
    {home:'Tottenham Hotspur', away:'Aston Villa', competition:'Premier League', date:'2026-09-19', time:'12:30', probHome:47.0, probAway:26.5, avgGoals:2.8, meetings:6, derby:false},
    {home:'Brighton', away:'Arsenal', competition:'Premier League', date:'2026-09-19', time:'15:00', probHome:19.7, probAway:56.7, avgGoals:2.8, meetings:6, derby:false},
    {home:'Newcastle United', away:'Hull City', competition:'Premier League', date:'2026-09-19', time:'15:00', probHome:60.2, probAway:18.2, avgGoals:2.5, meetings:2, derby:false},
    {home:'Sevilla', away:'Barcelona', competition:'La Liga', date:'2026-09-19', time:'20:00', probHome:7.5, probAway:81.2, avgGoals:3.8, meetings:6, derby:false},
    {home:'Bournemouth', away:'Liverpool', competition:'Premier League', date:'2026-09-20', time:'14:00', probHome:31.3, probAway:43.7, avgGoals:3.0, meetings:6, derby:false},
    {home:'Manchester City', away:'Sunderland', competition:'Premier League', date:'2026-09-20', time:'14:00', probHome:74.8, probAway:9.6, avgGoals:3.5, meetings:3, derby:false},
    {home:'Fulham', away:'Manchester United', competition:'Premier League', date:'2026-09-20', time:'16:30', probHome:28.0, probAway:46.8, avgGoals:2.6, meetings:6, derby:false},
    {home:'Atletico Madrid', away:'Real Madrid', competition:'La Liga', date:'2026-09-20', time:'15:15', probHome:27.6, probAway:48.2, avgGoals:3.4, meetings:6, derby:true},
    {home:'Arsenal', away:'Lille', competition:'Champions League', date:'2026-10-13', time:'20:00', probHome:75.0, probAway:8.9, avgGoals:2.9, meetings:2, derby:false},
    {home:'Atletico Madrid', away:'Manchester United', competition:'Champions League', date:'2026-10-13', time:'20:00', probHome:40.2, probAway:35.0, avgGoals:3.2, meetings:3, derby:false},
    {home:'Galatasaray', away:'Barcelona', competition:'Champions League', date:'2026-10-13', time:'20:00', probHome:12.5, probAway:72.8, avgGoals:3.1, meetings:3, derby:false},
    {home:'RB Leipzig', away:'PSV Eindhoven', competition:'Champions League', date:'2026-10-13', time:'20:00', probHome:46.8, probAway:29.0, avgGoals:3.3, meetings:2, derby:false}
  ];

  function hype(f){
    const gap = Math.abs(f.probHome - f.probAway);
    const closeness = (100 - gap) * 0.4;
    const goals = f.avgGoals * 8;
    const rivalry = f.derby ? 15 : 0;
    return Math.round(closeness + goals + rivalry);
  }
  function computeRanked(list){ return list.map(f => ({...f, score: hype(f)})).sort((a,b)=>b.score-a.score); }
  let fixturesRanked = computeRanked(fixtures);

  const H2H_CACHE_KEY = 'balloondiary_h2h_cache_v1';
  const H2H_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24 hours, to stay well under the free API tier's daily limit

  function loadH2HCache(){
    try{ return JSON.parse(localStorage.getItem(H2H_CACHE_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function saveH2HCache(cache){
    try{ localStorage.setItem(H2H_CACHE_KEY, JSON.stringify(cache)); }
    catch(e){ console.warn('h2h cache write failed', e); }
  }

  // Fetches real head-to-head data from /api/h2h for each fixture, only when
  // this page and /api/h2h.js are deployed together on the same origin (see
  // README.md). On claude.ai, or if the endpoint isn't reachable, this fails
  // silently and the app keeps using its built-in illustrative estimates.
  let usingLiveH2H = false;

  async function refreshFixturesWithRealH2H(){
    const cache = loadH2HCache();
    const now = Date.now();
    let changed = false;

    const updated = await Promise.all(fixtures.map(async f => {
      const key = `${f.home}__${f.away}`;
      const cached = cache[key];
      if(cached && (now - cached.ts) < H2H_CACHE_TTL_MS){
        usingLiveH2H = true;
        return { ...f, avgGoals: cached.avgGoals ?? f.avgGoals, meetings: cached.meetings ?? f.meetings };
      }
      try{
        const res = await fetch(`/api/h2h?home=${encodeURIComponent(f.home)}&away=${encodeURIComponent(f.away)}`);
        if(!res.ok) throw new Error('h2h request failed');
        const data = await res.json();
        if(data.avgGoals != null){
          cache[key] = { avgGoals: data.avgGoals, meetings: data.meetings, ts: now };
          changed = true;
          usingLiveH2H = true;
          return { ...f, avgGoals: data.avgGoals, meetings: data.meetings };
        }
        return f;
      }catch(e){
        return f; // no /api/h2h on this origin (e.g. still on claude.ai), or the call failed — keep the estimate
      }
    }));

    if(changed) saveH2HCache(cache);

    fixtures.length = 0;
    fixtures.push(...updated);
    fixturesRanked = computeRanked(fixtures);
    if(view === 'home' || view === 'lookout') renderContent();
  }

  /* ================= HELPERS ================= */
  const monthAbbr = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
  function dayNum(s){ return parseDate(s).getDate(); }
  function monShort(s){ return monthAbbr[parseDate(s).getMonth()]; }
  function fullDateLabel(s){ const d = parseDate(s); return `${dayName[d.getDay()]} ${d.getDate()} ${monthAbbr[d.getMonth()]}`; }
  function daysAway(s){ const today = new Date(2026,8,17); const d = parseDate(s); return Math.round((d-today)/86400000); }
  function starsDisplay(n){ let out=''; for(let i=1;i<=5;i++) out += starIcon(i<=n); return `<span class="stars">${out}</span>`; }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function sortedDiary(){ return [...db.diary].sort((a,b)=> parseDate(b.date) - parseDate(a.date)); }

  /* ================= NAV ================= */

    {id:'home', label:'Home', short:'Home', icon:'home'},

    {id:'lookout', label:'Look out for', short:'Lookout', icon:'radar'},
    {id:'lists', label:'Lists', short:'Lists', icon:'list'},
    {id:'wrapped', label:'Wrapped', short:'Wrapped', icon:'wrapped'},
    {id:'profile', label:'Profile', short:'Profile', icon:'user'}

      <ul class="nav-list">

    const tb = document.getElementById('topbarLog'); if(tb) tb.addEventListener('click', ()=>openMatchModal());
  }

  /* ================= VIEWS ================= */
  function renderHome(){

    opts = opts||{};

  function renderDiary(){
    const items = sortedDiary();

    return `<div>${items.map(m=>matchRow(m,{editable:true})).join('')}</div>`;

  function renderStadium(){
    const items = sortedDiary().filter(m=>m.attendedLive);
    const venues = new Set(items.map(m=>m.venue).filter(Boolean));
    if(!items.length) return emptyState('No games attended live yet', 'Mark a diary entry as "attended live" to start building your stadium record.', 'Go to diary', 'goDiary');

  function renderFixtures(){
    const byDate = {};
    fixtures.slice().sort((a,b)=>parseDate(a.date)-parseDate(b.date)).forEach(f=>{
      (byDate[f.date] = byDate[f.date]||[]).push(f);
    });
    return Object.keys(byDate).map(date=>{
      const dAway = daysAway(date);
      const label = dAway===0?'Today':dAway===1?'Tomorrow':`${fullDateLabel(date)} · in ${dAway} days`;
      return `<h3 style="font-family:'IBM Plex Sans'; font-size:13.5px; color:var(--text-muted); margin:22px 0 6px;">${label}</h3>
      <div>${byDate[date].map(f=>`
        <div class="divider-row">
          <div class="date-col"><div class="d">${f.time}</div></div>
          <div class="row-main">
            <div class="row-title">${badge(f.home)}${f.home} <span class="row-score">vs</span> ${f.away}${badge(f.away)}</div>
            <div class="row-meta">${compPill(f.competition, f.derby)}${f.derby?`<span class="pill"><span class="dot dot-derby"></span>Derby</span>`:''}</div>
          </div>
        </div>`).join('')}</div>`;
    }).join('');
  }

  function renderLookout(){
    const dataNote = usingLiveH2H
      ? `A quick model, not a prophecy. It blends three things: how close the win probabilities are, each pair's real average goals per game from API-Football's head-to-head data, and whether there's rivalry history between them. Football rarely reads the script anyway.`
      : `A quick model, not a prophecy. It blends three things: how close the win probabilities are, each pair's average goals per game across their last handful of head-to-head meetings, and whether there's rivalry history between them. The goals figures below are illustrative estimates for this demo rather than pulled from a live stats provider — football rarely reads the script anyway.`;
    return `<p style="color:var(--text-muted); font-size:13.5px; max-width:60ch; margin:-8px 0 20px;">
      ${dataNote}
    </p>
    ${fixturesRanked.slice(0,7).map(f=>{
      const closenessNote = Math.abs(f.probHome-f.probAway) < 20 ? 'Tightly matched on paper' : 'One side favoured, but goals likely';
      return `<div class="lookout-card">
        <div class="lookout-top">
          <div>
            <div class="row-title" style="margin-bottom:6px;">${badge(f.home)}${f.home} <span class="row-score">vs</span> ${f.away}${badge(f.away)}</div>
            <div class="row-meta">${compPill(f.competition, f.derby)}<span class="pill">${fullDateLabel(f.date)}, ${f.time}</span></div>
          </div>
          <div class="hype-score">${f.score}<span>hype score</span></div>
        </div>
        <div class="meter"><div class="meter-fill" style="width:${Math.min(f.score,100)}%"></div></div>
        <div class="reason-tags">
          <span class="pill">${closenessNote}</span>
          <span class="pill">Averaged ${f.avgGoals.toFixed(1)} goals per game across their last ${f.meetings} meetings</span>
          ${f.derby?`<span class="pill"><span class="dot dot-derby"></span>Rivalry fixture</span>`:''}
        </div>
      </div>`;
    }).join('')}`;
  }

  function renderLists(){
    return `
      <div style="margin-bottom:16px;"><button class="btn btn-accent" id="newListBtn">${svg('plus')} New list</button></div>
      ${db.lists.length ? db.lists.map(l=>`

  }

  function renderListDetail(list){
    const matches = list.matchIds.map(id=>db.diary.find(m=>m.id===id)).filter(Boolean);

      <button class="btn" id="backToLists" style="margin-bottom:16px;">&larr; All lists</button>

      <div style="margin-bottom:16px;"><button class="btn" id="editListMatches">Edit matches in this list</button></div>
      ${matches.length ? matches.map(m=>matchRow(m,{})).join('') : emptyState('Nothing added yet','Add matches from your diary to this list.','Edit matches','editListMatches')}
    `;
  }

  function renderWrapped(){
    const diary = db.diary;
    if(!diary.length) return emptyState('Nothing to wrap yet','Log a few matches and your football wrapped will build itself.','Log a match','openLog');
    const total = diary.length;
    const avg = (diary.reduce((s,m)=>s+m.rating,0)/total).toFixed(1);
    const live = diary.filter(m=>m.attendedLive).length;
    const compCounts = {};
    diary.forEach(m=>{ compCounts[m.competition] = (compCounts[m.competition]||0)+1; });
    const topComp = Object.entries(compCounts).sort((a,b)=>b[1]-a[1])[0];
    const top5 = diary.filter(m=>m.rating===5);
    const totalStars = diary.reduce((s,m)=>s+m.rating,0);
    return `
      <div class="wrapped-card">
        <div class="wrapped-year">2026</div>
        <div class="wrapped-sub">Your football year, so far</div>
        <div class="wrapped-row"><span class="label">Matches logged</span><span class="val">${total}</span></div>
        <div class="wrapped-row"><span class="label">Average rating</span><span class="val">${avg} ★</span></div>
        <div class="wrapped-row"><span class="label">Total stars given</span><span class="val">${totalStars}</span></div>
        <div class="wrapped-row"><span class="label">Games attended live</span><span class="val">${live}</span></div>
        <div class="wrapped-row"><span class="label">Most-watched competition</span><span class="val" style="font-size:16px; font-family:'IBM Plex Sans'; font-weight:600;">${topComp?topComp[0]:'—'}</span></div>
        <div class="wrapped-row" style="border-bottom:none; flex-direction:column; align-items:flex-start; gap:8px;">
          <span class="label">Favourite teams</span>
          <div class="chips">${db.profile.favouriteTeams.map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')}</div>
        </div>
      </div>
      ${top5.length?`<h3 style="font-family:'IBM Plex Sans'; font-size:15px; margin:26px 0 10px;">Your perfect fives</h3>${top5.map(m=>matchRow(m,{})).join('')}`:''}
    `;
  }

  function renderProfile(){
    const total = db.diary.length;
    const avg = total ? (db.diary.reduce((s,m)=>s+m.rating,0)/total).toFixed(1) : '—';
    const live = db.diary.filter(m=>m.attendedLive).length;

        <div class="stat-cell"><div class="stat-num">${avg}</div><div class="stat-label">Average rating</div></div>
        <div class="stat-cell"><div class="stat-num">${live}</div><div class="stat-label">Attended live</div></div>
        <div class="stat-cell"><div class="stat-num">${db.lists.length}</div><div class="stat-label">Lists created</div></div>
      </div>
      <h3 style="font-family:'IBM Plex Sans'; font-size:15px; margin:26px 0 4px;">Recent activity</h3>
      ${sortedDiary().slice(0,3).map(m=>matchRow(m,{})).join('') || '<p style="color:var(--text-muted); font-size:13.5px;">Nothing logged yet.</p>'}
      <div style="margin-top:30px; border-top:1px solid var(--border); padding-top:16px;">
        <button class="btn" id="resetData">Reset demo data</button>
      </div>

  function emptyState(title, body, btnLabel, action){
    return `<div class="empty"><h3>${title}</h3><p>${body}</p><button class="btn btn-accent" data-empty-action="${action}">${btnLabel}</button></div>`;
  }

  const viewMeta = {
    home:{title:'Home', sub:''},
    diary:{title:'Diary', sub:'Every match you\'ve logged, most recent first.'},
    fixtures:{title:'Fixtures', sub:'Upcoming matches from the leagues you follow.'},
    stadium:{title:'Stadium log', sub:'Matches you saw with your own eyes.'},
    lookout:{title:'Look out for', sub:'Upcoming fixtures ranked by our hype model.'},
    lists:{title:'Lists', sub:'Your own collections, curated your way.'},
    wrapped:{title:'Wrapped', sub:'A season summary, built from your diary.'},
    profile:{title:'Profile', sub:''}
  };

  let openListId = null;

  function renderContent(){
    let body = '';
    let head = viewMeta[view];
    if(view==='home') body = renderHome();
    else if(view==='diary') body = renderDiary();
    else if(view==='fixtures') body = renderFixtures();
    else if(view==='stadium') body = renderStadium();
    else if(view==='lookout') body = renderLookout();
    else if(view==='lists'){
      if(openListId){ const l = db.lists.find(x=>x.id===openListId); body = renderListDetail(l); head=null; }
      else body = renderLists();
    }
    else if(view==='wrapped') body = renderWrapped();
    else if(view==='profile') body = renderProfile();

    document.getElementById('content').innerHTML = `
      ${head ? `<div class="view-head"><h1>${head.title}</h1>${head.sub?`<p>${head.sub}</p>`:''}</div>` : ''}
      ${body}
    `;
    bindContentEvents();
  }

  /* ================= EVENTS ================= */
  function bindContentEvents(){
    document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click', ()=>openMatchModal(el.dataset.edit)));
    document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click', ()=>{
      if(confirm('Delete this match from your diary?')){
        db.diary = db.diary.filter(m=>m.id!==el.dataset.del);
        db.lists.forEach(l=>{ l.matchIds = l.matchIds.filter(id=>id!==el.dataset.del); });
        save(); renderContent();
      }
    }));
    document.querySelectorAll('[data-empty-action]').forEach(el=>el.addEventListener('click', ()=>{
      const a = el.dataset.emptyAction;
      if(a==='openLog') openMatchModal();
      if(a==='goDiary'){ view='diary'; renderAll(); }
      if(a==='openNewList') openListModal();
      if(a==='editListMatches') openPickerModal(openListId);
    }));
    const newListBtn = document.getElementById('newListBtn'); if(newListBtn) newListBtn.addEventListener('click', ()=>openListModal());
    document.querySelectorAll('[data-list]').forEach(el=>el.addEventListener('click', ()=>{ openListId = el.dataset.list; renderContent(); }));
    const back = document.getElementById('backToLists'); if(back) back.addEventListener('click', ()=>{ openListId=null; renderContent(); });
    const editMatches = document.getElementById('editListMatches'); if(editMatches) editMatches.addEventListener('click', ()=>openPickerModal(openListId));

    // profile
    const pName = document.getElementById('pName');
    if(pName) pName.addEventListener('change', ()=>{ db.profile.name = pName.value.trim(); save(); renderNav(); renderContent(); });
    const pHandle = document.getElementById('pHandle');
    if(pHandle) pHandle.addEventListener('change', ()=>{ db.profile.handle = pHandle.value.trim(); save(); });
    const pBio = document.getElementById('pBio');
    if(pBio) pBio.addEventListener('change', ()=>{ db.profile.bio = pBio.value; save(); });
    document.querySelectorAll('[data-rmteam]').forEach(el=>el.addEventListener('click', ()=>{
      db.profile.favouriteTeams.splice(Number(el.dataset.rmteam),1); save(); renderContent();
    }));
    const addTeamForm = document.getElementById('addTeamForm');
    if(addTeamForm) addTeamForm.addEventListener('submit', e=>{
      e.preventDefault();
      const input = document.getElementById('newTeamInput');
      if(input.value.trim()){ db.profile.favouriteTeams.push(input.value.trim()); save(); renderContent(); }
    });
    const resetBtn = document.getElementById('resetData');
    if(resetBtn) resetBtn.addEventListener('click', ()=>{
      if(confirm('This clears your diary, lists and profile edits and restores the sample data. Continue?')){
        db = { profile: JSON.parse(JSON.stringify(defaultProfile)), diary: JSON.parse(JSON.stringify(seedDiary)), lists: JSON.parse(JSON.stringify(seedLists)) };
        save(); renderAll();
      }
    });
  }

  function renderAll(){ renderNav(); renderContent(); }

  /* ================= MATCH MODAL ================= */
  function openMatchModal(id){

    let rating = existing ? existing.rating : 0;

          </div>

            <div class="stars" id="mStars">${[1,2,3,4,5].map(i=>`<span data-star="${i}">${starIcon(i<=rating,true)}</span>`).join('')}</div>
          </div>
          <div class="checkline"><input type="checkbox" id="mLive" ${existing&&existing.attendedLive?'checked':''}> Attended live at the stadium</div>
          <div class="field" id="mVenueField" style="display:${existing&&existing.attendedLive?'block':'none'}"><label>Venue</label><input id="mVenue" value="${existing?escapeHtml(existing.venue||''):''}" placeholder="e.g. Emirates Stadium, London"></div>
          <div class="field"><label>Review</label><textarea id="mReview" placeholder="What made it worth (or not worth) the time?">${existing?escapeHtml(existing.review||''):''}</textarea></div>
          <div class="modal-foot">
            <button class="btn" id="mCancel">Cancel</button>

      el.addEventListener('click', ()=>{
        rating = Number(el.dataset.star);
        document.querySelectorAll('#mStars [data-star]').forEach(s=>{
          s.innerHTML = starIcon(Number(s.dataset.star)<=rating, true);
        });
      });
    });
    document.getElementById('mLive').addEventListener('change', e=>{
      document.getElementById('mVenueField').style.display = e.target.checked ? 'block':'none';
    });
    document.getElementById('mCancel').addEventListener('click', closeModal);
    document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
    document.getElementById('mSave').addEventListener('click', ()=>{
      const home = document.getElementById('mHome').value.trim();
      const away = document.getElementById('mAway').value.trim();
      if(!home || !away){ alert('Add both team names.'); return; }
      const data = {
        home, away,
        competition: document.getElementById('mComp').value,
        date: document.getElementById('mDate').value || '2026-09-17',
        score: document.getElementById('mScore').value.trim(),
        rating: rating,
        attendedLive: document.getElementById('mLive').checked,
        venue: document.getElementById('mVenue') ? document.getElementById('mVenue').value.trim() : '',
        review: document.getElementById('mReview').value.trim()
      };
      if(existing){ Object.assign(existing, data); }
      else { data.id = 'd'+Date.now(); db.diary.push(data); }
      save(); closeModal(); renderAll();
    });
  }

  function openListModal(){
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h2>New list</h2>
          <div class="field"><label>List name</label><input id="lName" placeholder="e.g. Best Champions League nights"></div>
          <div class="field"><label>Description (optional)</label><textarea id="lDesc" placeholder="What ties this list together?"></textarea></div>
          <div class="modal-foot">
            <button class="btn" id="lCancel">Cancel</button>
            <button class="btn btn-accent" id="lSave">Create list</button>
          </div>
        </div>
      </div>`;
    document.getElementById('lCancel').addEventListener('click', closeModal);
    document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
    document.getElementById('lSave').addEventListener('click', ()=>{
      const name = document.getElementById('lName').value.trim();
      if(!name){ alert('Give your list a name.'); return; }
      const list = {id:'l'+Date.now(), name, description: document.getElementById('lDesc').value.trim(), matchIds:[]};
      db.lists.push(list); save(); closeModal();
      openListId = list.id; renderContent();
    });
  }

  function openPickerModal(listId){
    const list = db.lists.find(l=>l.id===listId);
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h2>Add matches</h2>
          <p style="color:var(--text-muted); font-size:13px; margin-top:-8px;">Choose which diary entries belong in "${escapeHtml(list.name)}".</p>
          <div style="max-height:340px; overflow-y:auto; margin:14px 0;">
            ${sortedDiary().map(m=>`
              <label class="picker-item">
                <input type="checkbox" data-pick="${m.id}" ${list.matchIds.includes(m.id)?'checked':''}>
                <span>${m.home} vs ${m.away} <span style="color:var(--text-muted);">· ${m.competition}</span></span>
              </label>`).join('') || '<p style="color:var(--text-muted); font-size:13px;">No diary entries yet — log a match first.</p>'}
          </div>
          <div class="modal-foot">
            <button class="btn" id="pkCancel">Cancel</button>
            <button class="btn btn-accent" id="pkSave">Save</button>
          </div>
        </div>
      </div>`;
    document.getElementById('pkCancel').addEventListener('click', closeModal);
    document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
    document.getElementById('pkSave').addEventListener('click', ()=>{
      list.matchIds = Array.from(document.querySelectorAll('[data-pick]:checked')).map(el=>el.dataset.pick);
      save(); closeModal(); renderContent();
    });
  }

  function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

  /* ================= INIT ================= */
  renderAll();
  refreshFixturesWithRealH2H();
})();
</script>
</body>
</html>
